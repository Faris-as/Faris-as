<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" fill="none">
  <!-- Animated gold shimmer divider — Sir Faris ⚔ github.com/Faris-as -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A3D14" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#6B5718"/>
      <stop offset="0.85" stop-color="#6B5718"/>
      <stop offset="1" stop-color="#4A3D14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="-60" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
      <animate attributeName="x1" values="-80;960" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1040" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#C98F1B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="13" width="900" height="2" rx="1" fill="url(#base)"/>
  <rect x="0" y="13" width="900" height="2" fill="url(#sheen)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- center sword-point gems -->
  <g transform="translate(450,14)">
    <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="url(#gem)"/>
    <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="none" stroke="#FFF3C2" stroke-width="1">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(410,14)">
    <rect x="-4" y="-4" width="8" height="8" transform="rotate(45)" fill="url(#gem)" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.3;0.75" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(490,14)">
    <rect x="-4" y="-4" width="8" height="8" transform="rotate(45)" fill="url(#gem)" opacity="0.75">
      <animate attributeName="opacity" values="0.3;0.75;0.3" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
