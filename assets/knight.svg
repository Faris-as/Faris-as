<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 148" width="256" height="296">
  <!-- Sir Faris — animated pixel knight. Gold & Steel theme. Made for github.com/Faris-as -->
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="0.55" stop-color="#C9D6E8"/>
      <stop offset="1" stop-color="#8B97A8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#D89A1E"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="98" y1="0" x2="98" y2="10">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="y1" values="14;92" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="24;102" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- ===== KNIGHT BODY (idle bob) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -4; 0 0; 0 -2; 0 0" dur="2.4s" repeatCount="indefinite"/>

    <!-- Shadow -->
    <ellipse cx="64" cy="140" rx="30" ry="4" fill="#0E1116" opacity="0.55">
      <animate attributeName="rx" values="30;27;30" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ===== SHIELD (left arm) ===== -->
    <g>
      <rect x="2" y="52" width="24" height="52" fill="#4C5563"/>
      <rect x="2" y="52" width="24" height="52" fill="none" stroke="url(#gold)" stroke-width="2"/>
      <rect x="10" y="56" width="8" height="44" fill="url(#gold)"/>
      <rect x="4" y="72" width="20" height="8" fill="url(#gold)"/>
      <rect x="6" y="66" width="16" height="4" fill="#2A2F3A" opacity="0.35">
        <animate attributeName="opacity" values="0.35;0;0.35" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <!-- shield sparkle -->
      <rect x="5" y="55" width="3" height="3" fill="#FFFBEB">
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ===== LEGS & BOOTS ===== -->
    <rect x="40" y="104" width="16" height="24" fill="#8B97A8"/>
    <rect x="72" y="104" width="16" height="24" fill="#8B97A8"/>
    <rect x="44" y="104" width="12" height="24" fill="#A9B4C4" opacity="0.6"/>
    <rect x="76" y="104" width="12" height="24" fill="#A9B4C4" opacity="0.6"/>
    <rect x="36" y="128" width="20" height="10" fill="#2A2F3A"/>
    <rect x="72" y="128" width="20" height="10" fill="#2A2F3A"/>

    <!-- ===== TORSO ===== -->
    <rect x="32" y="56" width="64" height="48" fill="#B7C1D1"/>
    <!-- breastplate shading -->
    <rect x="32" y="56" width="64" height="10" fill="#D6DEEA"/>
    <rect x="32" y="94" width="64" height="10" fill="#8B97A8"/>
    <!-- gold cross emblem -->
    <rect x="59" y="62" width="10" height="38" fill="url(#gold)"/>
    <rect x="45" y="74" width="38" height="10" fill="url(#gold)"/>
    <!-- emblem glint -->
    <rect x="60" y="62" width="3" height="14" fill="#FFF6D5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- ===== BELT ===== -->
    <rect x="32" y="104" width="64" height="8" fill="#1E2229"/>
    <rect x="59" y="102" width="10" height="12" fill="url(#gold)"/>

    <!-- ===== PAULDRONS ===== -->
    <rect x="24" y="50" width="16" height="18" fill="#96A2B3"/>
    <rect x="88" y="50" width="16" height="18" fill="#96A2B3"/>
    <rect x="24" y="50" width="16" height="4" fill="url(#gold)"/>
    <rect x="88" y="50" width="16" height="4" fill="url(#gold)"/>

    <!-- ===== HELMET ===== -->
    <!-- plume -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 2 0; 0 0; -2 0; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <rect x="56" y="4" width="16" height="10" fill="url(#gold)"/>
      <rect x="48" y="10" width="10" height="10" fill="url(#gold)"/>
      <rect x="70" y="10" width="10" height="10" fill="url(#gold)"/>
      <rect x="50" y="6" width="6" height="4" fill="#FFEC9E"/>
    </g>
    <!-- dome -->
    <rect x="40" y="18" width="48" height="8" fill="#C9D4E4"/>
    <rect x="32" y="26" width="64" height="26" fill="#C9D4E4"/>
    <rect x="32" y="26" width="64" height="6" fill="#E3EAF4"/>
    <rect x="32" y="46" width="64" height="6" fill="#96A2B3"/>
    <!-- visor slit -->
    <rect x="30" y="34" width="68" height="12" fill="#14171D"/>
    <!-- eye glints -->
    <g>
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      <rect x="40" y="37" width="8" height="4" fill="url(#gold)"/>
      <rect x="80" y="37" width="8" height="4" fill="url(#gold)"/>
    </g>
    <!-- chin -->
    <rect x="40" y="52" width="48" height="8" fill="#96A2B3"/>
  </g>

  <!-- ===== GREATSWORD (right hand) ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 112 76; 1.5 112 76; 0 112 76" dur="2.4s" repeatCount="indefinite"/>
    <!-- blade -->
    <rect x="106" y="14" width="12" height="70" fill="url(#blade)"/>
    <rect x="106" y="14" width="4" height="70" fill="#FFFFFF" opacity="0.75"/>
    <rect x="106" y="8" width="12" height="8" fill="#D6DEEA"/>
    <!-- moving sheen -->
    <rect x="107" y="12" width="10" height="12" fill="url(#sheen)">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <!-- crossguard, grip, pommel -->
    <rect x="96" y="84" width="32" height="10" fill="url(#gold)"/>
    <rect x="106" y="94" width="12" height="14" fill="#3A2E14"/>
    <rect x="104" y="108" width="16" height="8" fill="url(#gold)"/>
    <!-- blade sparkle -->
    <rect x="104" y="18" width="4" height="4" fill="#FFFDF0" opacity="0.9">
      <animate attributeName="opacity" values="0;1;0;0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== EMBERS ===== -->
  <circle cx="20" cy="130" r="2.4" fill="#FFB43D" opacity="0.9">
    <animate attributeName="cy" values="132;22" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="104" cy="140" r="2" fill="#FF8A3D" opacity="0.9">
    <animate attributeName="cy" values="142;30" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="140" r="1.8" fill="#FFD700" opacity="0.9">
    <animate attributeName="cy" values="142;16" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
